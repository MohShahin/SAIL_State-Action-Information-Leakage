name: Test sail package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. The "latest dependencies" rows resolve numpy/pandas at run time, so without a
    # periodic run they only ever reflect whatever was newest at the last push; a new numpy/pandas
    # release that breaks the package would go unnoticed until the next unrelated commit.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python's result independently instead of cancelling the rest on first failure.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Install build tooling
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

  # Tests the LOW end of the dependency range, the way the matrix above tests the low end of the
  # Python range. The pins are the lowest numpy/pandas that have installable wheels for each Python
  # -- i.e. the floor pip could ever resolve to on that interpreter -- so this job is what backs up
  # whatever lower bounds pyproject.toml declares. A bound is only claimed once it's been tested here.
  test-minimum-versions:
    name: minimum versions (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per Python in the matrix above. Each pin pair is the oldest numpy/pandas with
          # wheels for that Python on both Linux and Windows (checked against PyPI's file listings and
          # confirmed resolvable as Linux CPython). The 3.9 entry is the absolute floor and is the one
          # pyproject.toml's declared lower bounds must equal.
          - python-version: "3.9"
            numpy: "1.19.3"
            pandas: "1.1.3"
            declared-floor: true
          - python-version: "3.10"
            numpy: "1.21.3"
            pandas: "1.3.4"
          - python-version: "3.11"
            numpy: "1.23.2"
            pandas: "1.5.0"
          - python-version: "3.12"
            numpy: "1.26.0"
            pandas: "2.1.1"
          - python-version: "3.13"
            numpy: "2.1.0"
            pandas: "2.2.3"
          - python-version: "3.14"
            numpy: "2.3.2"
            pandas: "2.3.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned minimum numpy/pandas (binary wheels only)
        run: |
          pip install --only-binary=:all: "numpy==${{ matrix.numpy }}" "pandas==${{ matrix.pandas }}" "pytest>=7.0"

      # --no-deps so pip cannot "helpfully" upgrade the pinned minimums to satisfy declared bounds.
      - name: Install the package without resolving its dependencies
        run: pip install --no-deps -e .

      # Every declared requirement must actually admit what this job installed.
      - name: Check the declared bounds admit the pinned minimums
        run: pip check

      # The declared lower bounds must be EXACTLY what this job verifies -- no looser (an untested
      # claim) and no tighter (needlessly excluding versions that work). Loosening a bound in
      # pyproject.toml therefore requires moving the matching pin here in the same change.
      - name: Assert pyproject's declared lower bounds equal the verified floor
        if: ${{ matrix.declared-floor }}
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          declared = {n: re.search(rf'"{n}>=([0-9][0-9.]*)"', text).group(1) for n in ("numpy", "pandas")}
          verified = {"numpy": "${{ matrix.numpy }}", "pandas": "${{ matrix.pandas }}"}
          print("declared:", declared, "| verified:", verified)
          assert declared == verified, f"declared bounds {declared} != verified floor {verified}"
          PY

      # A job that silently tested the latest versions would prove nothing -- fail loudly instead.
      - name: Assert the minimums are really what is installed
        run: |
          python - <<'PY'
          import numpy, pandas
          want = {"numpy": "${{ matrix.numpy }}", "pandas": "${{ matrix.pandas }}"}
          got = {"numpy": numpy.__version__, "pandas": pandas.__version__}
          print("wanted:", want, "| got:", got)
          assert got == want, f"minimum-version pins were not honoured: wanted {want}, got {got}"
          PY

      - name: Run tests at the minimum versions
        run: pytest tests/ -v

  # Every job above runs on Linux. The package is also used on Windows (it is developed there), so run
  # the suite once natively at the newest dependencies to catch anything platform-specific. One
  # Python (3.12) is enough: an OS difference is not a Python-version difference, and the Python
  # range is already covered on Linux.
  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Show what is actually installed
        run: python -c "import sys, numpy, pandas; print(sys.platform, sys.version.split()[0], 'numpy', numpy.__version__, 'pandas', pandas.__version__)"

      - name: Run tests
        run: pytest tests/ -v
